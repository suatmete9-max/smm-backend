<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBoost Pro - Hybrid SMM Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <!-- AUTHENTICATION CARD OVERLAY -->
    <div id="authModal" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 p-8 rounded-2xl max-w-md w-full border border-gray-800 shadow-2xl text-center">
            <h2 class="text-3xl font-black text-indigo-500 mb-1">SocialBoost PRO</h2>
            <p class="text-gray-400 text-xs mb-6">Choose authentication method to access SMM Panel</p>

            <!-- 1. Google Auth Button -->
            <button onclick="handleGoogleAuth()" class="w-full bg-white text-gray-900 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 mb-5 hover:bg-gray-200 transition shadow-md">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Sign in with Google
            </button>

            <!-- Divider -->
            <div class="flex items-center my-4">
                <div class="flex-grow border-t border-gray-800"></div>
                <span class="px-3 text-gray-500 text-xs font-semibold">OR SIGNUP WITH EMAIL</span>
                <div class="flex-grow border-t border-gray-800"></div>
            </div>

            <!-- 2. Email Verification Step -->
            <div id="emailStep">
                <input type="email" id="userEmail" placeholder="Enter your email" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white focus:border-indigo-500 outline-none">
                <button onclick="requestVerification()" id="sendBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-bold transition">Send Verification Code</button>
            </div>

            <!-- OTP Code Step -->
            <div id="otpStep" class="hidden">
                <input type="text" id="otpCode" placeholder="Enter 6-Digit Code" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-center tracking-widest text-indigo-400 font-bold outline-none">
                <button onclick="confirmOTP()" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold transition">Complete Verification</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainDashboard" class="hidden container mx-auto p-4 max-w-5xl">
        <header class="flex justify-between items-center py-4 mb-6 border-b border-gray-800">
            <div>
                <h1 class="text-2xl font-black text-indigo-400">SocialBoost <span class="bg-indigo-900 text-indigo-200 text-xs px-2 py-0.5 rounded">HYBRID</span></h1>
                <p id="loggedInAccount" class="text-xs text-gray-400"></p>
            </div>
            <button onclick="logOutUser()" class="bg-red-950 text-red-400 border border-red-800/40 px-3 py-1.5 rounded-lg text-xs">Logout</button>
        </header>

        <!-- SMM PANEL ORDER ENGINE -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 max-w-xl mx-auto shadow-xl">
            <h3 class="font-bold text-xl mb-4 text-indigo-400">🚀 Place SMM Boost Order</h3>

            <label class="text-xs text-gray-400 mb-1 block">Platform Category</label>
            <select id="platformCat" onchange="renderPlatformServices()" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white">
                <option value="instagram">Instagram Services</option>
                <option value="facebook">Facebook Services</option>
                <option value="youtube">YouTube Services</option>
            </select>

            <label class="text-xs text-gray-400 mb-1 block">Service Selected</label>
            <select id="platformService" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white"></select>

            <label class="text-xs text-gray-400 mb-1 block">Target Profile / Video Link</label>
            <input type="text" id="targetUrl" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white">

            <label class="text-xs text-gray-400 mb-1 block">Quantity</label>
            <input type="number" id="orderQuantity" value="1000" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-6 text-white">

            <button onclick="startCheckout()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3.5 rounded-xl font-bold shadow-lg transition">Pay via Cashfree UPI</button>
        </div>
    </div>

    <script>
        const cashfree = Cashfree({ mode: "production" });

        const catalog = {
            instagram: ["Instagram Real Followers", "Instagram Post Likes", "Instagram Reel Views"],
            facebook: ["Facebook Page Followers", "Facebook Post Reactions", "Facebook Video Views"],
            youtube: ["YouTube Subscribers", "YouTube Video Views", "YouTube Watch Time"]
        };

        function renderPlatformServices() {
            const cat = document.getElementById("platformCat").value;
            const select = document.getElementById("platformService");
            select.innerHTML = "";
            catalog[cat].forEach(item => {
                const opt = document.createElement("option");
                opt.value = item;
                opt.innerText = item;
                select.appendChild(opt);
            });
        }
        renderPlatformServices();

        function handleGoogleAuth() {
            const googleUser = "user_" + Math.floor(Math.random()*1000) + "@gmail.com";
            localStorage.setItem("userSession", googleUser);
            launchDashboard(googleUser);
        }

        async function requestVerification() {
            const email = document.getElementById("userEmail").value;
            if(!email) return alert("Please enter email!");

            const btn = document.getElementById("sendBtn");
            btn.innerText = "Sending...";

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message);
                document.getElementById("emailStep").classList.add("hidden");
                document.getElementById("otpStep").classList.remove("hidden");
            } catch(e) {
                alert("Server Error! Check connection.");
            } finally {
                btn.innerText = "Send Verification Code";
            }
        }

        async function confirmOTP() {
            const email = document.getElementById("userEmail").value;
            const otp = document.getElementById("otpCode").value;

            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, otp })
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem("userSession", email);
                launchDashboard(email);
            } else {
                alert(data.message);
            }
        }

        function launchDashboard(user) {
            document.getElementById("authModal").classList.add("hidden");
            document.getElementById("mainDashboard").classList.remove("hidden");
            document.getElementById("loggedInAccount").innerText = "Logged as: " + user;
        }

        function logOutUser() {
            localStorage.removeItem("userSession");
            location.reload();
        }

        window.onload = function() {
            const user = localStorage.getItem("userSession");
            if(user) launchDashboard(user);
        };

        async function startCheckout() {
            const link = document.getElementById("targetUrl").value;
            if(!link) return alert("Please enter link!");

            const res = await fetch('/api/create-cashfree-order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ amount: 15, link })
            });
            const data = await res.json();
            if(data.success) {
                cashfree.checkout({ paymentSessionId: data.payment_session_id, redirectTarget: "_self" });
            } else {
                alert("Cashfree Order Error: " + data.message);
            }
        }
    </script>
</body>
</html>
