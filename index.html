<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBoost Pro - Authentic SMM Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <!-- REAL OTP AUTHENTICATION MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 p-8 rounded-2xl max-w-md w-full border border-gray-800 shadow-2xl">
            <h2 class="text-3xl font-black text-indigo-500 text-center mb-1">SocialBoost PRO</h2>
            <p class="text-gray-400 text-xs text-center mb-6">Enter Email to Receive 6-Digit OTP</p>

            <div id="stepEmail">
                <input type="email" id="userEmail" placeholder="Enter your email address" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white focus:border-indigo-500 outline-none">
                <button onclick="sendOTP()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-bold transition">Send Verification Code</button>
            </div>

            <div id="stepOTP" class="hidden">
                <input type="text" id="inputOTP" placeholder="Enter 6-Digit OTP" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-center tracking-widest text-xl text-indigo-400 focus:border-indigo-500 outline-none">
                <button onclick="verifyOTP()" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold transition">Verify & Login</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainDashboard" class="hidden container mx-auto p-4 max-w-6xl">
        <header class="flex justify-between items-center py-4 mb-6 border-b border-gray-800">
            <div>
                <h1 class="text-2xl font-black text-indigo-400">SocialBoost <span class="bg-indigo-900 text-indigo-200 text-xs px-2 py-0.5 rounded">VERIFIED</span></h1>
                <p id="userAccount" class="text-xs text-gray-400"></p>
            </div>
            <button onclick="logout()" class="bg-red-950 text-red-400 border border-red-800/40 px-3 py-1.5 rounded-lg text-xs">Logout</button>
        </header>

        <!-- SMM SERVICES ORDER ENGINE -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 mb-8 max-w-2xl mx-auto">
            <h3 class="font-bold text-xl mb-4 text-indigo-400 flex items-center gap-2">🚀 Place SMM Order</h3>

            <!-- Category Dropdown -->
            <label class="text-xs text-gray-400 mb-1 block">1. Select Platform Category</label>
            <select id="smmCategory" onchange="updateServices()" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white">
                <option value="instagram">Instagram Services</option>
                <option value="facebook">Facebook Services</option>
                <option value="youtube">YouTube Services</option>
            </select>

            <!-- Service Dropdown -->
            <label class="text-xs text-gray-400 mb-1 block">2. Select Service Type</label>
            <select id="smmService" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white"></select>

            <!-- Target Link -->
            <label class="text-xs text-gray-400 mb-1 block">3. Target Profile / Post Link</label>
            <input type="text" id="targetLink" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-4 text-white">

            <!-- Quantity -->
            <label class="text-xs text-gray-400 mb-1 block">4. Quantity</label>
            <input type="number" id="orderQty" placeholder="1000" value="1000" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 mb-6 text-white">

            <!-- Checkout Button -->
            <button onclick="checkoutOrder()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 py-3.5 rounded-xl font-bold shadow-lg hover:opacity-90 transition">Pay & Start Delivery (Cashfree UPI)</button>
        </div>
    </div>

    <script>
        const cashfree = Cashfree({ mode: "production" });

        const servicesData = {
            instagram: [
                "Instagram Real Followers [Instant]",
                "Instagram Post Likes [High Quality]",
                "Instagram Reel Views [Fast]",
                "Instagram Custom Comments"
            ],
            facebook: [
                "Facebook Page Followers / Likes",
                "Facebook Post Likes & Reactions",
                "Facebook Video / Reel Views",
                "Facebook Profile Followers"
            ],
            youtube: [
                "YouTube Subscribers [Non-Drop]",
                "YouTube Video Views [Monetizable]",
                "YouTube Watch Time Hours",
                "YouTube Video Likes"
            ]
        };

        function updateServices() {
            const cat = document.getElementById("smmCategory").value;
            const serviceSelect = document.getElementById("smmService");
            serviceSelect.innerHTML = "";
            servicesData[cat].forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.innerText = s;
                serviceSelect.appendChild(opt);
            });
        }
        updateServices();

        async function sendOTP() {
            const email = document.getElementById("userEmail").value;
            if(!email) return alert("Please enter email!");
            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            alert(data.message);
            document.getElementById("stepEmail").classList.add("hidden");
            document.getElementById("stepOTP").classList.remove("hidden");
        }

        async function verifyOTP() {
            const email = document.getElementById("userEmail").value;
            const otp = document.getElementById("inputOTP").value;
            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, otp })
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem("sessionUser", email);
                showDashboard(email);
            } else {
                alert(data.message);
            }
        }

        function showDashboard(email) {
            document.getElementById("authModal").classList.add("hidden");
            document.getElementById("mainDashboard").classList.remove("hidden");
            document.getElementById("userAccount").innerText = "Logged as: " + email;
        }

        function logout() {
            localStorage.removeItem("sessionUser");
            location.reload();
        }

        window.onload = function() {
            const user = localStorage.getItem("sessionUser");
            if(user) showDashboard(user);
        }

        async function checkoutOrder() {
            const link = document.getElementById("targetLink").value;
            const service = document.getElementById("smmService").value;
            if(!link) return alert("Please enter profile/video link!");

            const res = await fetch('/api/create-cashfree-order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ amount: 15, link, service })
            });
            const data = await res.json();
            if(data.success) {
                cashfree.checkout({ paymentSessionId: data.payment_session_id, redirectTarget: "_self" });
            }
        }
    </script>
</body>
</html>
