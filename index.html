<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBoost - SMM Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- LOGIN CONTAINER -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-blue-600 mb-4 text-center">SocialBoost Login</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Email Address</label>
                    <input type="email" id="emailInput" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="user@gmail.com">
                </div>
                <button onclick="requestOTP()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Sign in with OTP</button>
            </div>
        </div>
    </div>

    <!-- OTP MODAL -->
    <div id="otpModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm text-center">
            <h3 class="text-lg font-bold mb-2">Enter Verification Code</h3>
            <p id="otpMsg" class="text-sm text-blue-600 mb-4 font-semibold"></p>
            <input type="text" id="otpInput" maxlength="6" class="w-full p-3 border rounded-lg text-center text-xl font-bold tracking-widest mb-4" placeholder="6-Digit OTP">
            <button onclick="verifyOTP()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Verify & Login</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden min-h-screen flex">
        <div class="w-64 bg-slate-900 text-white p-5 space-y-6">
            <h1 class="text-xl font-bold text-blue-400">SocialBoost</h1>
            <nav class="space-y-2">
                <button onclick="showPage('order')" class="w-full text-left p-3 rounded bg-blue-600">New Order</button>
                <button onclick="showPage('funds')" class="w-full text-left p-3 rounded hover:bg-slate-800">Add Funds</button>
            </nav>
        </div>
        <div class="flex-1 p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 id="userEmailDisplay" class="font-bold text-gray-700"></h2>
                <div class="bg-green-100 text-green-800 px-4 py-2 rounded-lg font-bold">Balance: ₹<span id="userBalance">0.00</span></div>
            </div>

            <!-- ORDER VIEW -->
            <div id="orderPage" class="bg-white p-6 rounded-xl shadow space-y-4 max-w-xl">
                <h3 class="text-xl font-bold mb-4">Place New Order</h3>
                <input type="text" id="orderLink" placeholder="Enter Target Link (e.g. Instagram / YouTube URL)" class="w-full p-3 border rounded-lg">
                <input type="number" id="orderQty" placeholder="Quantity (e.g. 1000)" class="w-full p-3 border rounded-lg" value="1000">
                <button onclick="placeOrder()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Place Order Now</button>
            </div>

            <!-- ADD FUNDS VIEW -->
            <div id="fundsPage" class="hidden bg-white p-6 rounded-xl shadow space-y-4 max-w-xl">
                <h3 class="text-xl font-bold mb-4">Add Funds via UPI</h3>
                <input type="number" id="fundAmount" placeholder="Enter Amount (₹)" class="w-full p-3 border rounded-lg" value="100">
                <button onclick="generateUPIQR()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">Generate Valid UPI QR</button>
            </div>
        </div>
    </div>

    <!-- DYNAMIC REAL QR MODAL -->
    <div id="qrModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm text-center space-y-4">
            <h3 class="text-lg font-bold text-gray-800">Scan & Pay via Any UPI App</h3>
            <div class="flex justify-center border-2 border-blue-500 p-2 rounded-lg bg-white">
                <img id="realQrImage" src="" alt="Dynamic UPI QR" class="w-64 h-64 object-contain">
            </div>
            <p class="text-lg font-extrabold text-blue-600">Payable: ₹<span id="qrAmountDisplay">0.00</span></p>
            <button onclick="closeQRModal()" class="w-full bg-gray-600 text-white py-2 rounded-lg font-bold">Close</button>
        </div>
    </div>

    <script>
        let currentUserEmail = '';

        async function requestOTP() {
            const email = document.getElementById('emailInput').value;
            if(!email) return alert('Enter Email');
            
            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if(data.success) {
                currentUserEmail = email;
                document.getElementById('otpMsg').innerText = `ENTER CODE: ${data.code}`;
                document.getElementById('otpModal').classList.remove('hidden');
            } else {
                alert(data.message);
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otpInput').value;
            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentUserEmail, otp })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('otpModal').classList.add('hidden');
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = currentUserEmail;
                document.getElementById('userBalance').innerText = data.user.balance.toFixed(2);
            } else {
                alert(data.message);
            }
        }

        function showPage(page) {
            document.getElementById('orderPage').classList.toggle('hidden', page !== 'order');
            document.getElementById('fundsPage').classList.toggle('hidden', page !== 'funds');
        }

        async function generateUPIQR() {
            const amount = document.getElementById('fundAmount').value;
            const res = await fetch('/api/create-cashfree-order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ amount })
            });
            const data = await res.json();
            if(data.success) {
                // Server se direct generated REAL DYNAMIC QR IMAGE bind ho rahi hai
                document.getElementById('realQrImage').src = data.qr_image;
                document.getElementById('qrAmountDisplay').innerText = data.amount;
                document.getElementById('qrModal').classList.remove('hidden');
            }
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        async function placeOrder() {
            const link = document.getElementById('orderLink').value;
            const qty = document.getElementById('orderQty').value;
            if(!link) return alert('Enter Link!');
            
            const res = await fetch('/api/place-order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentUserEmail, serviceId: "1", link, quantity: qty, charge: 10 })
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) {
                document.getElementById('userBalance').innerText = data.new_balance;
            }
        }
    </script>
</body>
</html>
